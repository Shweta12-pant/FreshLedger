services:
  sonar-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-freshledger-sonar-local}
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sonar"]
      interval: 5s
      timeout: 4s
      retries: 16
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-freshledger-sonar-local}
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    restart: unless-stopped

volumes:
  sonar-db-data:
  sonar-data:
  sonar-extensions:
  sonar-logs:
