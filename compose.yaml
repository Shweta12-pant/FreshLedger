x-runtime: &runtime
  image: ${APP_IMAGE:-freshledger:dev}
  environment:
    DB_HOST: db
    DB_NAME: ${MYSQL_DATABASE:-freshledger}
    DB_USER: ${MYSQL_USER:-freshledger}
    DB_PASSWORD: ${MYSQL_PASSWORD:-freshledger-demo}
    INVENTORY_TIMEZONE: ${INVENTORY_TIMEZONE:-Asia/Kolkata}
    SEED_DEMO: ${SEED_DEMO:-1}
  init: true

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-freshledger}
      MYSQL_USER: ${MYSQL_USER:-freshledger}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-freshledger-demo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-freshledger-demo-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=tcp -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -Nse 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 25
      start_period: 20s
    restart: unless-stopped

  init:
    <<: *runtime
    pull_policy: never
    command: ["python", "-m", "inventory.commands", "init"]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *runtime
    build:
      context: .
      target: runtime
    pull_policy: never
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-freshledger}
      DB_USER: ${MYSQL_USER:-freshledger}
      DB_PASSWORD: ${MYSQL_PASSWORD:-freshledger-demo}
      INVENTORY_TIMEZONE: ${INVENTORY_TIMEZONE:-Asia/Kolkata}
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 8s
    restart: unless-stopped

  worker:
    <<: *runtime
    pull_policy: never
    command: ["python", "-m", "inventory.commands", "worker"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.11.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-freshledger-demo}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
